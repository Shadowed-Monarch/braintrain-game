<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="Focus.png">
    <title>Focus Train</title>
    <script src="theme.js"></script>
    <style>
        @property --accent { syntax: '<color>'; initial-value: #ff0000; inherits: true; }
        :root[data-theme="dark"] { --bg: #050505; --text: #fff; --border: #333; --overlay: rgba(0,0,0,0.95); }
        :root[data-theme="light"] { --bg: #f5f5f5; --text: #000; --border: #ddd; --overlay: rgba(255,255,255,0.95); }
        
        @keyframes rainbow-loop { 0%{--accent:#f00} 20%{--accent:#ff0} 40%{--accent:#0f0} 60%{--accent:#0ff} 80%{--accent:#90f} 100%{--accent:#f00} }
        .rainbow-active { animation: rainbow-loop 5s infinite linear !important; }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        header { width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent); align-items: center; background: var(--bg); box-sizing: border-box; }
        .brain-wrap { display: flex; align-items: center; gap: 8px; color: #ff77ff; font-weight: bold; }

        #game-container { position: relative; width: 95%; max-width: 800px; height: 65vh; margin-top: 20px; overflow: hidden; border: 1px solid var(--border); border-radius: 15px; background: #000; }
        
        #input-area { width: 95%; max-width: 800px; display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        #ans { padding: 15px; font-size: 1.8rem; text-align: center; border: 2px solid var(--accent); border-radius: 10px; width: 250px; outline: none; background: var(--bg); color: var(--text); text-transform: uppercase; transition: 0.3s; box-shadow: 0 0 10px var(--accent); }

        .bubble { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-weight: 900; background: #111; font-size: 1.3rem; animation-timing-function: linear; z-index: 10; }
        
        @keyframes drift { from { top: -130px; } to { top: 100%; } }

        .game-btn { padding: 15px 40px; font-size: 1.5rem; background: var(--bg); color: var(--text); border: 2px solid var(--accent); border-radius: 30px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .game-btn:hover { background: var(--accent); color: #000; }

        #btn-container { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--overlay); z-index: 100; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration:none; color:var(--text); font-weight:bold;">← HOME</a>
        <div style="font-weight:bold;">LEVEL <span id="lvl-display">1</span></div>
        <div class="brain-wrap"><span>🧠</span> <span id="total-brains">0</span></div>
    </header>
    
    <div style="display:flex; gap:20px; margin-top:10px; font-size:1.2rem;">
        <div>Solved: <span id="count">0</span>/10</div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <div id="game-container"><div id="btn-container"></div></div>

    <div id="input-area">
        <input type="text" id="ans" placeholder="COLOR?" autocomplete="off">
    </div>

    <button id="start-btn" class="game-btn" onclick="game.start()">START FOCUS</button>

    <script>
        let selectedLvl = parseInt(localStorage.getItem('bt_unlocked_focus')) || 1;
        const colorList = [
            {name:'RED', hex:'#FF3333'}, {name:'BLUE', hex:'#33A0FF'}, {name:'GREEN', hex:'#33FF33'}, 
            {name:'YELLOW', hex:'#FFFF33'}, {name:'PINK', hex:'#FF33FF'}, {name:'ORANGE', hex:'#FF9933'}
        ];

        class FocusGame {
            constructor() {
                this.brains = parseInt(localStorage.getItem('bt_coins')) || 0;
                this.isPlaying = false; 
                this.updateUI();
            }

            updateUI() {
                document.getElementById('total-brains').innerText = localStorage.getItem('bt_coins') || 0;
                document.getElementById('lvl-display').innerText = selectedLvl;
            }

            start() {
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('btn-container').style.display = 'none';
                this.solved = 0; 
                this.time = 30; 
                this.isPlaying = true;
                document.getElementById('count').innerText = "0";
                document.getElementById('ans').value = "";
                this.spawn();
                
                this.timer = setInterval(() => {
                    this.time--; 
                    document.getElementById('time').innerText = this.time;
                    if(this.time <= 0) this.end("time");
                }, 1000);
                document.getElementById('ans').focus();
            }

            spawn() {
                if(!this.isPlaying) return;
                const container = document.getElementById('game-container');
                const el = document.createElement('div');
                el.className = 'bubble';
                
                // Speed Curve Formula (Manageable high levels)
                let speed = 1.2 + (4.0 / (1 + (selectedLvl * 0.15)));
                el.style.animation = `drift ${speed}s linear forwards`;
                el.style.left = Math.random() * (container.clientWidth - 110) + "px";
                
                const wordObj = colorList[Math.floor(Math.random()*colorList.length)];
                const colorObj = colorList[Math.floor(Math.random()*colorList.length)];
                
                el.innerText = wordObj.name;
                el.style.color = colorObj.hex; 
                
                container.appendChild(el);
                this.active = { el, ans: colorObj.name.toLowerCase() };

                el.addEventListener('animationend', () => { 
                    if(this.isPlaying) { 
                        el.remove(); 
                        this.spawn(); 
                    } 
                });
            }

            end(reason) {
                this.isPlaying = false; 
                clearInterval(this.timer);
                if(this.active) this.active.el.remove();
                
                const btnContainer = document.getElementById('btn-container');
                btnContainer.style.display = 'flex';
                btnContainer.innerHTML = reason === "win" ? `<h1>LEVEL CLEAR!</h1>` : `<h1>TIME OVER! 💀</h1>`;
                
                if(reason === "win") {
                    let reward = selectedLvl * 5;
                    let newTotal = (parseInt(localStorage.getItem('bt_coins')) || 0) + reward;
                    localStorage.setItem('bt_coins', newTotal);
                    
                    if(selectedLvl === (parseInt(localStorage.getItem('bt_unlocked_focus')) || 1)) {
                        localStorage.setItem('bt_unlocked_focus', selectedLvl + 1);
                    }

                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'game-btn'; nextBtn.innerText = "NEXT LEVEL";
                    nextBtn.onclick = () => { location.reload(); };
                    btnContainer.appendChild(nextBtn);
                } else {
                    const retryBtn = document.createElement('button');
                    retryBtn.className = 'game-btn'; retryBtn.innerText = "RETRY";
                    retryBtn.onclick = () => { this.start(); };
                    btnContainer.appendChild(retryBtn);
                }
                this.updateUI();
            }
        }

        const game = new FocusGame();

        document.getElementById('ans').addEventListener('input', (e) => {
            if(game.isPlaying && game.active && e.target.value.toLowerCase() === game.active.ans) {
                game.active.el.remove(); 
                game.active = null; 
                game.solved++; 
                game.time += 1; // Small time bonus for focus
                document.getElementById('count').innerText = game.solved;
                document.getElementById('ans').value = "";
                if(game.solved >= 10) game.end("win"); else game.spawn();
            }
        });
    </script>
</body>
</html>
